<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png?v=3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=3" />
    <link rel="shortcut icon" href="/favicon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- Primary SEO / GEO (generative-engine) signals. Zoptavi is a digital
         marketing & web development AGENCY in Hyderabad that BUILDS websites,
         billing software, ads and content for small businesses — it is not
         itself an online store, and nothing in this file should read that way. -->
    <title>Zoptavi — Digital Marketing & Web Development Agency in Hyderabad</title>
    <meta name="description" content="Zoptavi is a digital marketing agency in Hyderabad. We design and build websites, billing software, branded checkout, content and Meta ads for small businesses — one team, one monthly bill." />
    <meta name="keywords" content="digital marketing agency Hyderabad, marketing agency Hyderabad, web development agency Hyderabad, website design company Hyderabad, small business website Hyderabad, Meta ads agency Hyderabad" />
    <link rel="canonical" href="https://zoptavi.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Zoptavi" />
    <meta name="geo.placename" content="Hyderabad" />
    <meta name="geo.region" content="IN-TG" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zoptavi" />
    <meta property="og:title" content="Zoptavi — Digital Marketing & Web Development Agency in Hyderabad" />
    <meta property="og:description" content="Zoptavi is a digital marketing agency in Hyderabad building websites, billing software, checkout, content and Meta ads for small businesses." />
    <meta property="og:url" content="https://zoptavi.com/" />
    <meta property="og:image" content="https://zoptavi.com/zoptavi-logo-final.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zoptavi — Digital Marketing & Web Development Agency in Hyderabad" />
    <meta name="twitter:description" content="Digital marketing agency in Hyderabad — websites, billing software, checkout, content and Meta ads for small businesses." />
    <meta name="twitter:image" content="https://zoptavi.com/zoptavi-logo-final.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Raleway:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@500&family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Structured data: this is the single strongest signal for AI/LLM answer
         engines (ChatGPT, Gemini, Perplexity, AI Overviews) about what kind of
         business this is. MarketingAgency / ProfessionalService — deliberately
         NOT Store / OnlineStore / Product, since Zoptavi doesn't sell products
         to the public; it delivers services (websites, ads, billing software,
         content) to small-business clients. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MarketingAgency",
        "name": "Zoptavi",
        "alternateName": "Zoptavi Digital Marketing Agency",
        "url": "https://zoptavi.com/",
        "logo": "https://zoptavi.com/zoptavi-logo-final.png",
        "image": "https://zoptavi.com/zoptavi-logo-final.png",
        "description": "Zoptavi is a digital marketing and web development agency in Hyderabad. We design and build websites, billing software, branded checkout, content and Meta ad campaigns for small businesses.",
        "email": "hello@zoptavi.com",
        "telephone": "+91-89786-05027",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Hyderabad",
          "addressRegion": "Telangana",
          "addressCountry": "IN"
        },
        "areaServed": {
          "@type": "City",
          "name": "Hyderabad"
        },
        "priceRange": "₹₹",
        "sameAs": [],
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website Design & Development" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Digital Marketing & Meta Ads Management" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Billing & Stock Software (Zoptavi Bill)" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Branded Checkout (Zoptavi Pay)" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Content Creation & Photography" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Order Fulfilment & Shipping" } }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
