name = "zoptavi-admin"
main = "worker.js"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "zoptavi-admin"
database_id = "26eb88bd-7867-4fa0-95f9-ab9df2062655"

[[r2_buckets]]
binding = "MEDIA"
